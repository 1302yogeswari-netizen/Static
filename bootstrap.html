
<html>
    <head>
        <title>Reg form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <div class="container mb-5">
            <div class="card mt-5 p-4 bg-success">
                <form>
                <h3 class="text-center">Registration form</h3>
                <div class="row mb-3">
                    <div class="col-md-6 md-3">
                <label for="name" class="form-label">Name</label>
                <input
                    type="text"
                    class="form-control"
                    name="name"
                    id="name"
                    placeholder="Enter your name"
                />
                </div>
                    <div class="col-md-6 md-3">
                <label for="age" class="form-label">Age</label>
                <input
                    type="number"
                    class="form-control"
                    name="age"
                    id="age"
                    placeholder="Enter your age"
                />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6 md-3">
            <label for="nationality" class="form-label">Nationality</label>
            <select
                class="form-select form-select-lg"
                name="nationality"
                id="nationality"
            >
                <option selected>Select country</option>
                <option value="">India</option>
                <option value="">Russia</option>
                <option value="">China</option>
                <option value="">Japan</option>
                <option value="">Korea</option>
                <option value="">US</option>
            </select>
            </div>
            <div class="col-md-6 md-3">
            <label for="nationality" class="form-label">Cities</label>
            <select
                class="form-select form-select-lg"
                name="nationality"
                id="nationality"
            >
                <option selected>Select city</option>
                <option value="">Coimbatore</option>
                <option value="">Erode</option>
                <option value="">Salem</option>
                <option value="">Madurai</option>
                <option value="">Chennai</option>
            </select>
            </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6 md-3">
            <label class="form-label d-block">Gender</label>
            <div class="form-check form-check-inline" >
                <input
                    class="form-check-input"
                    type="radio"
                    name="gender"
                    id="female"
                    value="female"
                />
                <label class="form-check-label" for="female">Female</label>
            </div>
            <div class="form-check form-check-inline">
                <input
                    class="form-check-input"
                    type="radio"
                    name="gender"
                    id="male"
                    value="male"
                />
                <label class="form-check-label" for="male">Male</label>
            </div>
            <div class="form-check form-check-inline">
                <input
                    class="form-check-input"
                    type="radio"
                    name="gender"
                    id="others"
                    value="others"
                />
                <label class="form-check-label" for="others">Others</label>
            </div>
            </div>
            <div class="col-md-6 md-3">
                <label class="form-label d-block">Competitions</label>
            <div class="form-check form-check-inline">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="comp"
                    id="comp"
                    value="comp"
                />
                <label class="form-check-label" for="comp">Coding</label>
            </div>
            <div class="form-check form-check-inline">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="comp"
                    id="comp"
                    value="comp"
                />
                <label class="form-check-label" for="comp">Speech</label>
            </div>
            <div class="form-check form-check-inline">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="comp"
                    id="comp"
                    value="comp"
                />
                <label class="form-check-label" for="comp">Ramp walk</label>
            </div>
            <div class="form-check form-check-inline">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="comp"
                    id="comp"
                    value="comp"
                />
                <label class="form-check-label" for="comp">Singing</label>
            </div>
           </div>
           <div class="row mt-3">
            <div class="col-md-6 md-3">
            <label for="email" class="form-label">Email</label>
            <input
                type="email"
                class="form-control"
                name=""
                id=""
                aria-describedby="emailHelpId"
                placeholder="abc@mail.com"
            />
            </div>
            <div class="col-md-6 md-3">
                <label class="form-label d-block">Language known</label>
            <div class="form-check form-check-inline">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="comp"
                    id="comp"
                    value="comp"
                />
                <label class="form-check-label" for="lan">English</label>
            </div>
            <div class="form-check form-check-inline">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="comp"
                    id="comp"
                    value="comp"
                />
                <label class="form-check-label" for="lan">Japanese</label>
            </div>
            <div class="form-check form-check-inline">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="comp"
                    id="comp"
                    value="comp"
                />
                <label class="form-check-label" for="lan">French</label>
            </div>
            <div class="form-check form-check-inline">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="comp"
                    id="comp"
                    value="comp"
                />
                <label class="form-check-label" for="lan">Hindi</label>
            </div>
           </div>
           <div class="row mt-3">
            <div class="col-md-6 md-3">
            <div class="form-check form-check-inline"  style="margin-left:200px">
           <button
            type="submit"
            class="btn btn-primary"
           >
            Reset
           </button>
           </div>
           </div>
            <div class="col-md-6 md-3">
            <div class="form-check form-check-inline">
           <button
            type="submit"
            class="btn btn-primary"
           >
            Submit
           </button>
           </div>
           </div>
           </div>
        </form>
           </div>    
        </div>
    </body>
</html>
